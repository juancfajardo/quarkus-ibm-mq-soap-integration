quarkus.http.port=8081
quarkus.application.name=legacy-erp-mock

# SOAP endpoint: http://localhost:8081/soap/orders  (WSDL: ?wsdl)
quarkus.cxf.path=/soap
quarkus.cxf.endpoint."/orders".implementor=dev.juancfajardo.integration.erp.ErpOrderServiceImpl

# Worker pool large enough for the gateway's concurrent calls plus the artificial latency
quarkus.thread-pool.max-threads=64
quarkus.log.level=INFO
