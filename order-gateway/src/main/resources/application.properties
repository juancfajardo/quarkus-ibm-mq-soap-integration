quarkus.http.port=8080
quarkus.application.name=order-gateway

# Legacy ERP (SOAP)
quarkus.cxf.client.erp.client-endpoint-url=${ERP_URL:http://localhost:8081/soap/orders}
quarkus.cxf.client.erp.service-interface=dev.juancfajardo.integration.contract.ErpOrderService
quarkus.cxf.client.erp.connection-timeout=2000
quarkus.cxf.client.erp.receive-timeout=5000

# IBM MQ (defaults match the IBM MQ developer container)
mq.host=${MQ_HOST:localhost}
mq.port=${MQ_PORT:1414}
mq.channel=${MQ_CHANNEL:DEV.APP.SVRCONN}
mq.queue-manager=${MQ_QMGR:QM1}
mq.user=${MQ_USER:app}
mq.password=${MQ_APP_PASSWORD:passw0rd}
mq.orders-queue=${MQ_ORDERS_QUEUE:DEV.QUEUE.1}
mq.dead-letter-queue=${MQ_DLQ:DEV.DEAD.LETTER.QUEUE}
mq.producer-pool-size=16

# Consumers and retries
workers.count=${WORKERS:8}
retry.max-attempts=5
retry.base-delay-ms=50
retry.max-delay-ms=1000
retry.max-deliveries=3

quarkus.thread-pool.max-threads=64
quarkus.log.level=INFO
